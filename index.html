<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Tracker</title>
    <link rel="shortcut icon" href="./assets/jobs.png" type="image/x-icon">
    <!-- daisyui -->
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- google font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <style>
        * {
            font-family: "Geist", sans-serif;
        }
    </style>
</head>

<body class="bg-base-300 py-15">
    <header id="header" class="w-[90%] sm:w-[80%] md:w-[70%] mx-auto space-y-8 ">
        <h1 class="text-3xl font-bold">Job Application Tracker</h1>
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 ">
            <div id="card1" class="bg-base-100 p-5 rounded-2xl space-y-2">
                <p class="text-[14px] font-medium">Total</p>
                <h3 id="total-heading" class="font-bold text-2xl">0</h3>
            </div>
            <div id="card2" class="bg-base-100 p-5 rounded-2xl space-y-2">
                <p class="text-[14px] font-medium ">Interview</p>
                <h3 id="interview-total" class="font-bold text-2xl text-green-600">0</h3>
            </div>
            <div id="card3" class="bg-base-100 p-5 rounded-2xl space-y-2">
                <p class="text-[14px] font-bold">Rejected</p>
                <h3 id="rejected-total" class="font-bold text-2xl text-red-500">0</h3>
            </div>
        </div>
        <hr class="text-base-300 my-8">
    </header>

    <main id="main" class="w-[90%] sm:w-[80%] md:w-[70%] mx-auto ">
        <section class=" pt-12 space-y-8 pb-4">
           <div class="flex justify-between">
            <h3 class="text-[20px] font-semibold">Available Jobs</h3>
           <p class="text-[14px] font-medium text-black/50">
                    <span id="interview-total-side-full" class="hidden">
                        <span id="interview-total-side">0 </span>
                        of
                    </span>
                    <span id="rejected-total-side-full" class="hidden">
                        <span id="rejected-total-side">  0 </span>of
                    </span>
                    <span id="total-side" class="font-bold">0</span class="font-bold"> jobs  </p>
              
            </div>
             <div id="nav-btn-container" class="flex gap-3">
                <div><button id="all-filter-btn" onclick="toggle('all-filter-btn')"
                        class="btn w-20 px-4 py-2 bg-primary border-none rounded text-base-300">All</button></div>
                <div><button id="interview-filter-btn" onclick="toggle('interview-filter-btn')"
                        class="btn w-20 px-4 py-2 bg-gray-200 border-none rounded text-black/50">Interview</button>
                </div>
                <div><button id="rejected-filter-btn" onclick="toggle('rejected-filter-btn')"
                        class="btn w-20 px-4 py-2 bg-gray-200 border-none rounded text-black/50">Rejected</button>
                </div>
            </div>
            </section>



           <script src="app.js"></script>
            <script src="Machine.js"></script>
        </body>
</html>
