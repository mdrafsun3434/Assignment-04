<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Tracker</title>
    <link rel="shortcut icon" href="./assets/jobs.png" type="image/x-icon">
    <!-- daisyui -->
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- google font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <style>
        * {
            font-family: "Geist", sans-serif;
        }
    </style>
</head>
<body class="bg-base-300 py-15">
    <header id="header" class="w-[90%] sm:w-[80%] md:w-[70%] mx-auto space-y-8 ">
        <h1 class="text-3xl font-bold">Job Application Tracker</h1>
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 ">
            <div id="card1" class="bg-base-100 p-5 rounded-2xl space-y-2">
                <p class="text-[14px] font-bold">Total</p>
                <h3 id="total-heading" class="font-bold text-2xl">0</h3>
            </div>
            <div id="card2" class="bg-base-100 p-5 rounded-2xl space-y-2">
                <p class="text-[14px] font-bold">Interview</p>
                <h3 id="interview-total" class="font-bold text-2xl text-green-600">0</h3>
                </div>
              <div id="card3" class="bg-base-100 p-5 rounded-2xl space-y-2">
                <p class="text-[14px] font-bold">Rejected</p>
                <h3 id="rejected-total" class="font-bold text-2xl text-red-500">0</h3>
            </div>
        </div>
        <hr class="text-base-300 my-8">
    </header>



           <script src="app.js"></script>
            <script src="machine.js"></script>
        </body>
</html>
